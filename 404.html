<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Drew Guarini</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e3a4c">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/wga4rxe.css">
<style>
  :root { --paper:#faf6ef; --navy:#1e3a4c; --ink-soft:#4a5864; --accent:#d4694f; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:var(--paper); color:var(--ink-soft); font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif; text-align:center; }
  .box { max-width:520px; }
  .code { font-size:.8rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
  h1 { font-family:"pacaembu","Inter",sans-serif; font-size:clamp(2rem,6vw,2.8rem); line-height:1.1; color:var(--navy); margin:0 0 14px; }
  p { line-height:1.6; margin:0 0 26px; }
  .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a { text-decoration:none; font-weight:600; font-size:.95rem; padding:12px 22px; border-radius:999px; }
  .primary { background:var(--navy); color:#fff; }
  .secondary { border:1px solid var(--navy); color:var(--navy); }
</style>
</head>
<body>
<main class="box">
  <p class="code">404</p>
  <h1>This page wandered off.</h1>
  <p>The link may be old or mistyped. Try the home page or jump straight to the work.</p>
  <div class="links">
    <a class="primary" id="home" href="/">Back home</a>
    <a class="secondary" id="work" href="/work.html">See the work</a>
  </div>
</main>
<script>
  // Works on github.io/drewguarini/ and on a custom domain root.
  var base = location.pathname.indexOf('/drewguarini/') === 0 ? '/drewguarini/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('work').href = base + 'work.html';
</script>
</body>
</html>
